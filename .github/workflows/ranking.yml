name: Ranking

on:
  schedule:
    # Klo 21.15 Suomen aikaa. Cron on UTC:ssä, joten molemmat ajat ovat mukana
    # ja tarkista-job päästää läpi sen, joka osuu voimassa olevaan aikaan.
    - cron: "15 18 * * *"  # kesäaika (UTC+3)
    - cron: "15 19 * * *"  # talviaika (UTC+2)
  workflow_dispatch:
  repository_dispatch:
    types: [uusi-era]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  tarkista:
    runs-on: ubuntu-latest
    outputs:
      aja: ${{ steps.aika.outputs.aja }}
    steps:
      - id: aika
        env:
          AJASTUS: ${{ github.event.schedule }}
        run: |
          siirto=$(TZ=Europe/Helsinki date +%z)
          if [ -z "$AJASTUS" ] ||
             { [ "$AJASTUS" = "15 18 * * *" ] && [ "$siirto" = "+0300" ]; } ||
             { [ "$AJASTUS" = "15 19 * * *" ] && [ "$siirto" = "+0200" ]; }; then
            echo "aja=true" >> "$GITHUB_OUTPUT"
          else
            echo "aja=false" >> "$GITHUB_OUTPUT"
          fi

  laske:
    needs: tarkista
    if: needs.tarkista.outputs.aja == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # TTT-sovitusten välimuisti ajojen välillä
      - uses: actions/cache@v6
        with:
          path: tulokset/.valimuisti.json
          key: valimuisti-${{ github.run_id }}
          restore-keys: valimuisti-

      - run: python koodit/ranking.py
        env:
          DATA_URL: ${{ secrets.DATA_URL }}

      - run: mkdir _site && cp tulokset/sulkapalloranking.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
      - id: julkaisu
        uses: actions/deploy-pages@v5
